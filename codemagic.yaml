# Codemagic CI/CD — builds the Capacitor iOS app on Codemagic's macOS runners,
# so no local Mac is needed (works from Windows).
#
# ── REFERENCE SIGNING TEMPLATE ────────────────────────────────────────────────
# Every app in the account shares ONE distribution certificate. The RSA private
# key lives once as the secured Codemagic variable CERTIFICATE_PRIVATE_KEY in the
# 'appstore' variable group. Because all apps use the SAME key, fetch-signing
# -files reuses the single existing certificate instead of minting a new one —
# Apple caps distribution certs, so a key-per-app setup eventually wedges.
#
# To onboard a NEW app: copy the 'Set up code signing' step verbatim, set
# BUNDLE_ID, attach the 'appstore' group, and reuse the App Store Connect API
# key integration. NEVER run `openssl genrsa` for a new app — reuse the shared
# key so the shared certificate is reused.
#
# One-time in the Codemagic UI before the first green build:
#   1. App Store Connect API key integration named "codemagic".
#   2. The 'appstore' variable group containing CERTIFICATE_PRIVATE_KEY (secure)
#      — the shared distribution key.
#   3. In the Apple Developer portal, enable Push Notifications + Associated
#      Domains on the App ID (see docs/iOS_RUNBOOK.md).
# The project is SPM-based (no CocoaPods): build the .xcodeproj directly.
workflows:
  ios-capacitor:
    name: iOS build (Capacitor shell)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        # Shared, team/app-scoped group holding CERTIFICATE_PRIVATE_KEY (secure)
        # — the one distribution key reused across every app in the account.
        - appstore
        # App-specific runtime vars (Supabase URL/key, RapidAPI, etc.).
        - rugby_env
      node: 22
      xcode: latest
      vars:
        BUNDLE_ID: "com.rugbyleaguetakeover.app"
    integrations:
      app_store_connect: codemagic
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Validation gate (same as GitHub CI)
        script: npm run lint && npm run typecheck && npm test
      - name: Build web assets and sync into the iOS shell
        script: npm run build && npx cap sync ios
      # Fetch only existing signing files matching the shared distribution key.
      # Missing matching certificates or App Store profiles fail the build.
      - name: Set up code signing
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
          xcode-project use-profiles
      # App Store Connect rejects a re-used CFBundleVersion ("must be higher than
      # the previously uploaded version"). Stamp every build with Codemagic's
      # ever-incrementing $BUILD_NUMBER via CURRENT_PROJECT_VERSION (Info.plist
      # maps CFBundleVersion to it), so each upload is unique and monotonic.
      - name: Set a unique build number
        script: |
          set -e
          BN="${BUILD_NUMBER:-$(date +%s)}"
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = ${BN};/g" ios/App/App.xcodeproj/project.pbxproj
          echo "CFBundleVersion (CURRENT_PROJECT_VERSION) set to ${BN}"
      - name: Build signed IPA
        script: |
          xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  # Android / Google Play (Capacitor shell).
  #
  # The Android project lived on an unmerged branch for weeks, so the app on Play
  # was shipping a web build far older than the live site. It is on main now so a
  # rebuild always carries the current site, exactly like the iOS workflow above.
  #
  # Produces a signed .aab as an artifact — it does NOT auto-publish. Download it
  # from the build and upload to the Play Console yourself.
  android-capacitor:
    name: Android build (Capacitor shell)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      groups:
        - rugby_env
      android_signing:
        # One-time Codemagic setup: upload the private Android upload keystore
        # under this reference. Google Play App Signing keeps the app-signing
        # key separate from this upload key.
        - rlt_android_upload
      node: 22
      java: 21
      vars:
        PACKAGE_NAME: "com.rugbyleaguetakeover.app"
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Validation gate (same as GitHub CI)
        script: npm run lint && npm run typecheck && npm test
      - name: Set up Android SDK and optional Firebase config
        script: |
          set -e
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
          if [ -n "${FIREBASE_ANDROID_CONFIG:-}" ]; then
            printf '%s' "$FIREBASE_ANDROID_CONFIG" | base64 --decode > "$CM_BUILD_DIR/android/app/google-services.json"
          fi
      - name: Build web assets and sync into the Android shell
        script: npm run android:build
      - name: Build signed Android App Bundle
        script: |
          set -e
          cd android
          chmod +x gradlew
          # Play rejects an upload whose versionCode is not higher than the last
          # one, so mirror the iOS approach: Codemagic's incrementing counter,
          # falling back to a Unix timestamp (safely under Play's 2100000000 cap).
          VC="${BUILD_NUMBER:-$(date +%s)}"
          echo "versionCode ${VC}"
          ./gradlew bundleRelease \
            -PversionCode="${VC}" \
            -PversionName="1.0.${VC}"
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
      - android/app/build/reports/**
